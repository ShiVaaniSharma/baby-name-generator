<!DOCTYPE html>
<html class="light" lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Explore Names - Naam & Banao</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'brand-teal': '#286b59', 'ks-primary': '#28695c', 'ks-secondary': '#30628a', 'ks-surface': '#fbf9f8', 'ks-dark': '#1a4731' },
                    fontFamily: { "ks-sans": ['Outfit', 'sans-serif'], "ks-headline": ["Quicksand"] }
                }
            }
        }
    </script>
    <style>
        .ks-glass-nav { background: rgba(251, 249, 248, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(40, 105, 89, 0.1); }
        .ks-nav-link { position: relative; transition: all 0.3s ease; font-weight: 600; color: #5e6865; font-size: 14px; cursor: pointer; }
        .ks-nav-link:hover, .ks-nav-link.active { color: #28695c; }
        .ks-nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background: #28695c; transition: width 0.3s; }
        .ks-nav-link:hover::after, .ks-nav-link.active::after { width: 100%; }
        
        .ks-name-card { transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.05); background: white; position: relative; }
        .ks-name-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px -5px rgba(0,0,0,0.08); border-color: #28695c; }
        
        .ks-filter-active { background: #28695c !important; color: white !important; border-color: #28695c !important; }
        .ks-alpha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 4px; }
        .ks-alpha-btn { height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #e5e7eb; font-size: 10px; font-weight: 700; cursor: pointer; background: white; transition: 0.2s; }
        
        .ks-heart-icon.active { color: #ef4444 !important; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ks-heart-icon { transition: transform 0.2s ease; cursor: pointer; }
    </style>
</head>
<body class="bg-ks-surface pt-24 font-ks-sans text-gray-800">

    <nav class="ks-glass-nav fixed top-0 w-full z-[100]">
        <div class="flex justify-between items-center px-6 md:px-12 py-4 max-w-7xl mx-auto">
            <div class="font-ks-headline font-bold text-2xl text-ks-primary cursor-pointer flex items-center gap-2" onclick="window.location.href='index.html'">
                <span class="material-symbols-outlined text-3xl">child_care</span> Naam & Banao
            </div>
            <div class="hidden lg:flex items-center gap-8">
                <a href="index.html" class="ks-nav-link flex items-center gap-1">Home</a>
                <a href="about.html" class="ks-nav-link flex items-center gap-1">About</a>
                <a href="explore.html" class="ks-nav-link active flex items-center gap-1">Explore</a>
                <button onclick="ksDir_toggleShowFavorites()" id="ks-fav-btn" class="ks-nav-link flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">favorite</span> Favorites (<span id="ks-fav-count-nav">0</span>)
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <aside class="lg:w-1/4 space-y-4 lg:sticky lg:top-28 h-fit">
                <div class="relative">
                    <input type="text" id="ks-search-input" onkeyup="ksDir_masterFilter(true)" placeholder="Search names..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 focus:ring-ks-primary shadow-sm border text-sm">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-400 text-xl">search</span>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-gray-100">
                    <h3 class="font-bold text-gray-400 mb-3 text-[10px] uppercase tracking-widest">Alphabet</h3>
                    <div class="ks-alpha-grid" id="ks-alpha-container">
                        <button class="ks-alpha-btn ks-filter-active" onclick="ksDir_setAlpha('All', this)">All</button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-gray-100 text-sm">
                    <h3 class="font-bold text-gray-700 mb-2">Rashi</h3>
                    <select id="ks-rashi-select" onchange="ksDir_masterFilter(true)" class="w-full rounded-lg border-gray-200 text-sm focus:ring-ks-primary py-2">
                        <option value="All">All Rashis</option>
                        <option value="Mesha">Mesha (A, L, E)</option>
                        <option value="Vrishabha">Vrishabha (B, V, U)</option>
                        <option value="Mithuna">Mithuna (K, CH, G)</option>
                        <option value="Karka">Karka (D, H)</option>
                    </select>
                </div>
            </aside>

            <div class="lg:w-3/4">
                <div class="mb-4 flex flex-wrap justify-between items-center bg-white px-5 py-3 rounded-xl border border-gray-100 shadow-sm gap-4">
                    <span id="ks-count-label" class="font-bold text-ks-primary text-[10px] tracking-widest uppercase">0 Names Found</span>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button onclick="ksDir_setGender('All', this)" class="ks-gender-btn px-4 py-1 rounded-md text-[11px] font-bold ks-filter-active">All</button>
                        <button onclick="ksDir_setGender('Boy', this)" class="ks-gender-btn px-4 py-1 rounded-md text-[11px] font-bold">Boy</button>
                        <button onclick="ksDir_setGender('Girl', this)" class="ks-gender-btn px-4 py-1 rounded-md text-[11px] font-bold">Girl</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4" id="ks-names-wrapper"></div>

                <div class="mt-10 text-center" id="ks-pagination">
                    <button onclick="ksDir_loadMore()" class="bg-ks-primary text-white px-8 py-3 rounded-full font-bold hover:bg-ks-dark transition-all text-sm flex items-center gap-2 mx-auto">
                        Load More Names <span class="material-symbols-outlined text-sm">expand_more</span>
                    </button>
                </div>

                <div id="ks-empty-state" class="hidden text-center py-16 bg-white rounded-3xl border border-dashed border-gray-200">
                    <p class="text-gray-400 font-medium">No names found matching your criteria.</p>
                    <button onclick="ksDir_clearAll()" class="text-ks-primary font-bold text-sm mt-2 underline">Reset Filters</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ksDir_Database = [
            { n: "Aarav", m: "Peaceful; Wisdom", g: "Boy", r: "Mesha" },
            { n: "Ananya", m: "Unique; Peerless", g: "Girl", r: "Mesha" },
            { n: "Bhavin", m: "Winner; Illustrious", g: "Boy", r: "Vrishabha" },
            { n: "Diya", m: "Light; Brilliance", g: "Girl", r: "Karka" },
            { n: "Ishani", m: "Goddess Parvati", g: "Girl", r: "Mesha" },
            { n: "Kabir", m: "Great; Famous saint", g: "Boy", r: "Mithuna" },
            { n: "Myra", m: "Beloved; Sacred", g: "Girl", r: "Simha" },
            { n: "Reyansh", m: "Part of Lord Vishnu", g: "Boy", r: "Tula" },
            { n: "Saanvi", m: "Goddess Lakshmi", g: "Girl", r: "Kumbha" },
            { n: "Vihaan", m: "Dawn; New Era", g: "Boy", r: "Vrishabha" },
            { n: "Aditya", m: "The Sun", g: "Boy", r: "Mesha" },
            { n: "Kiara", m: "Dark-haired; Gift", g: "Girl", r: "Mithuna" },
            { n: "Arjun", m: "Bright; Shining", g: "Boy", r: "Mesha" },
            { n: "Zoya", m: "Alive; Loving", g: "Girl", r: "Meena" },
            { n: "Rohan", m: "Ascending", g: "Boy", r: "Tula" },
            { n: "Navya", m: "New; Modern", g: "Girl", r: "Vrishabha" }
        ];

        let ksDir_Alpha = 'All';
        let ksDir_Gender = 'All';
        let ksDir_Limit = 20; 
        let ksDir_Filtered = [];
        let ksDir_ShowFavs = false;
        let ksDir_Favorites = JSON.parse(localStorage.getItem('ks_user_favs')) || [];

        function ksDir_updateFavUI() {
            document.getElementById('ks-fav-count-nav').innerText = ksDir_Favorites.length;
        }

        function ksDir_toggleFav(name) {
            if (ksDir_Favorites.includes(name)) {
                ksDir_Favorites = ksDir_Favorites.filter(i => i !== name);
            } else {
                ksDir_Favorites.push(name);
            }
            localStorage.setItem('ks_user_favs', JSON.stringify(ksDir_Favorites));
            ksDir_updateFavUI();
            ksDir_render();
        }

        function ksDir_toggleShowFavorites() {
            ksDir_ShowFavs = !ksDir_ShowFavs;
            document.getElementById('ks-fav-btn').classList.toggle('ks-filter-active', ksDir_ShowFavs);
            ksDir_masterFilter(true);
        }

        function ksDir_setAlpha(val, btn) {
            ksDir_Alpha = val;
            document.querySelectorAll('.ks-alpha-btn').forEach(b => b.classList.remove('ks-filter-active'));
            btn.classList.add('ks-filter-active');
            ksDir_masterFilter(true);
        }

        function ksDir_setGender(val, btn) {
            ksDir_Gender = val;
            document.querySelectorAll('.ks-gender-btn').forEach(b => b.classList.remove('ks-filter-active'));
            btn.classList.add('ks-filter-active');
            ksDir_masterFilter(true);
        }

        function ksDir_masterFilter(resetLimit = false) {
            if (resetLimit) ksDir_Limit = 20;
            const search = document.getElementById('ks-search-input').value.toLowerCase();
            const rashi = document.getElementById('ks-rashi-select').value;

            ksDir_Filtered = ksDir_Database.filter(item => {
                const s = item.n.toLowerCase().includes(search);
                const a = ksDir_Alpha === 'All' || item.n.startsWith(ksDir_Alpha);
                const g = ksDir_Gender === 'All' || item.g === ksDir_Gender;
                const r = rashi === 'All' || item.r === rashi;
                const f = ksDir_Favorites.includes(item.n);
                if (ksDir_ShowFavs) return s && f;
                return s && a && g && r;
            });
            ksDir_render();
        }

        function ksDir_loadMore() {
            ksDir_Limit += 20;
            ksDir_render();
        }

        function ksDir_render() {
            const wrap = document.getElementById('ks-names-wrapper');
            const empty = document.getElementById('ks-empty-state');
            const pagin = document.getElementById('ks-pagination');
            wrap.innerHTML = '';
            const list = ksDir_Filtered.slice(0, ksDir_Limit);

            if (list.length === 0) {
                empty.classList.remove('hidden');
                pagin.classList.add('hidden');
            } else {
                empty.classList.add('hidden');
                list.forEach(item => {
                    const isFav = ksDir_Favorites.includes(item.n);
                    wrap.innerHTML += `
                        <div class="ks-name-card p-5 rounded-2xl flex flex-col justify-between h-full">
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[9px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-500 uppercase">${item.g}</span>
                                    <span onclick="ksDir_toggleFav('${item.n}')" class="ks-heart-icon material-symbols-outlined text-gray-300 hover:text-red-400 text-xl ${isFav ? 'active' : ''}">favorite</span>
                                </div>
                                <h3 class="text-xl font-ks-headline text-ks-primary font-bold mb-1">${item.n}</h3>
                                <p class="text-gray-500 text-xs leading-relaxed line-clamp-2" title="${item.m}">${item.m}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-50 flex items-center">
                                <span class="text-[10px] text-gray-400 font-medium">Rashi: ${item.r}</span>
                            </div>
                        </div>
                    `;
                });
                pagin.classList.toggle('hidden', ksDir_Limit >= ksDir_Filtered.length);
            }
            document.getElementById('ks-count-label').innerText = `${ksDir_Filtered.length} Names Found`;
        }

        function ksDir_clearAll() {
            document.getElementById('ks-search-input').value = '';
            document.getElementById('ks-rashi-select').value = 'All';
            ksDir_Alpha = 'All';
            ksDir_Gender = 'All';
            ksDir_ShowFavs = false;
            ksDir_masterFilter(true);
        }

        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.className = 'ks-alpha-btn'; b.innerText = l;
            b.onclick = () => ksDir_setAlpha(l, b);
            document.getElementById('ks-alpha-container').appendChild(b);
        });

        ksDir_updateFavUI();
        ksDir_masterFilter();
    </script>
</body>
</html>
